<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Cotação - CotaçãoWeb</title>
    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; }
        .form-card { border: none; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; }
        .card-header-custom { background: #198754; color: white; padding: 1.5rem; border: none; }
        .form-label { font-weight: 600; color: #495057; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.03em; }
        .form-control { padding: 0.8rem 1rem; border-radius: 10px; border: 1px solid #dee2e6; transition: all 0.2s; }
        .form-control:focus { border-color: #198754; box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.1); }
        .btn-submit { padding: 0.8rem 2rem; border-radius: 10px; font-weight: 700; transition: all 0.3s; }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(25, 135, 84, 0.2); }
        .btn-cancel { padding: 0.8rem 2rem; border-radius: 10px; font-weight: 600; color: #6c757d; }
    </style>
</head>
<body>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            
            <div class="mb-4 d-flex align-items-center justify-content-between">
                <div>
                    <h2 class="fw-bold text-dark mb-1">Criar Cotação</h2>
                    <p class="text-muted">Inicie um novo processo de compra preenchendo os dados básicos.</p>
                </div>
                <a href="{{ url_for('painel') }}" class="btn btn-light btn-sm border rounded-pill px-3">
                    <i class="bi bi-x-lg me-1"></i> Cancelar
                </a>
            </div>

            <div class="card form-card">
                <div class="card-header card-header-custom">
                    <div class="d-flex align-items-center">
                        <div class="bg-white bg-opacity-25 rounded-circle p-2 me-3">
                            <i class="bi bi-file-earmark-plus fs-4"></i>
                        </div>
                        <h4 class="mb-0 fw-bold">Dados da Solicitação</h4>
                    </div>
                </div>
                <div class="card-body p-4 p-md-5">
                    
                    <form method="POST">
                        <div class="row g-4">
                            <!-- SOLICITANTE -->
                            <div class="col-12">
                                <label class="form-label"><i class="bi bi-person me-1"></i> Nome do Solicitante</label>
                                <input 
                                    type="text" 
                                    name="solicitante" 
                                    class="form-control" 
                                    placeholder="Ex: João Silva - Departamento de TI"
                                    required 
                                    autofocus
                                >
                            </div>

                            <!-- FINALIDADE -->
                            <div class="col-12">
                                <label class="form-label"><i class="bi bi-tag me-1"></i> Finalidade / Projeto</label>
                                <input 
                                    type="text" 
                                    name="finalidade" 
                                    class="form-control" 
                                    placeholder="Ex: Renovação de licenças ou Expansão do Escritório"
                                >
                            </div>

                            <!-- OBSERVAÇÕES -->
                            <div class="col-12">
                                <label class="form-label"><i class="bi bi-chat-left-text me-1"></i> Observações Adicionais</label>
                                <textarea 
                                    name="observacoes" 
                                    class="form-control" 
                                    rows="4" 
                                    placeholder="Detalhes que podem ajudar no processo de cotação..."
                                ></textarea>
                            </div>

                            <!-- BOTÕES -->
                            <div class="col-12 pt-3">
                                <div class="d-grid d-md-flex gap-2 justify-content-md-end">
                                    <a href="{{ url_for('painel') }}" class="btn btn-cancel">Descartar</a>
                                    <button type="submit" class="btn btn-success btn-submit shadow-sm">
                                        <i class="bi bi-check2-circle me-1"></i> Salvar e Continuar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>

                </div>
            </div>

            <div class="text-center mt-4">
                <p class="text-muted small">
                    <i class="bi bi-info-circle me-1"></i> 
                    Após salvar, você poderá adicionar os itens e fornecedores na próxima tela.
                </p>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
