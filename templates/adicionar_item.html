<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Item - {{ cotacao.numero }}</title>
    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-dark: #1e293b;
            --secondary-slate: #64748b;
            --accent-blue: #2563eb;
            --bg-light: #f8fafc;
            --border-color: #e2e8f0;
        }

        body { 
            background-color: #f1f5f9; 
            font-family: 'Inter', sans-serif; 
            color: #334155; 
            line-height: 1.6;
        }

        /* Header Estilizado */
        .header-gradient { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            color: white; 
            padding: 2.5rem 0; 
            margin-bottom: 2rem; 
            border-radius: 0 0 24px 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        /* Card */
        .card-custom { 
            border: none; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            background: white; 
            overflow: hidden;
            max-width: 700px;
            margin: -2rem auto 3rem;
        }

        .card-body-custom {
            padding: 2.5rem;
        }

        .section-title {
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--primary-dark);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Form Estilizado */
        .form-label {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--secondary-slate);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-control {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            background-color: #fcfdfe;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            background-color: white;
        }

        /* Botões */
        .btn-custom {
            border-radius: 12px;
            padding: 0.8rem 1.5rem;
            font-weight: 700;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary-custom {
            background-color: var(--accent-blue);
            border: none;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-primary-custom:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3);
            color: white;
        }

        .btn-secondary-custom {
            background-color: #f1f5f9;
            border: 1px solid var(--border-color);
            color: var(--secondary-slate);
        }

        .btn-secondary-custom:hover {
            background-color: #e2e8f0;
            color: var(--primary-dark);
        }

        /* Ilustração/Ícone */
        .icon-box {
            width: 50px;
            height: 50px;
            background: rgba(37, 99, 235, 0.1);
            color: var(--accent-blue);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

<div class="header-gradient">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <nav aria-label="breadcrumb" class="d-flex justify-content-center">
                    <ol class="breadcrumb mb-2">
                        <li class="breadcrumb-item"><a href="{{ url_for('painel') }}" class="text-white-50 text-decoration-none">Painel</a></li>
                        <li class="breadcrumb-item"><a href="{{ url_for('visualizar_cotacao', cotacao_id=cotacao.id) }}" class="text-white-50 text-decoration-none">{{ cotacao.numero }}</a></li>
                        <li class="breadcrumb-item active text-white" aria-current="page">Adicionar Item</li>
                    </ol>
                </nav>
                <h1 class="display-6 fw-bold mb-1">Novo Item para Cotação</h1>
                <p class="lead opacity-75 mb-0">Insira os detalhes do produto ou serviço que deseja cotar.</p>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <div class="card card-custom">
        <div class="card-body card-body-custom">
            <div class="icon-box">
                <i class="bi bi-box-seam"></i>
            </div>
            
            <h5 class="section-title">Informações do Produto</h5>
            
            <form method="POST">
                <div class="mb-4">
                    <label class="form-label">Descrição Completa</label>
                    <input type="text" name="descricao" class="form-control" placeholder="Ex: Papel Sulfite A4 75g Branco" required autofocus>
                    <div class="form-text text-muted">Seja específico para facilitar o orçamento do fornecedor.</div>
                </div>

                <div class="row g-4 mb-5">
                    <div class="col-md-6">
                        <label class="form-label">Unidade de Medida</label>
                        <input type="text" name="unidade" class="form-control" placeholder="Ex: Un, Cx, Kg, Litro" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Quantidade</label>
                        <div class="input-group">
                            <input type="number" step="0.01" name="quantidade" class="form-control" placeholder="0,00" required>
                        </div>
                    </div>
                </div>

                <div class="d-flex flex-column flex-sm-row gap-3 pt-3 border-top">
                    <button type="submit" class="btn-custom btn-primary-custom flex-grow-1 justify-content-center">
                        <i class="bi bi-save"></i> Salvar e Adicionar Item
                    </button>
                    <a href="{{ url_for('visualizar_cotacao', cotacao_id=cotacao.id) }}" class="btn-custom btn-secondary-custom justify-content-center">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
    
    <div class="text-center mt-4">
        <p class="text-muted small">Dica: Itens bem descritos recebem orçamentos mais precisos.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
