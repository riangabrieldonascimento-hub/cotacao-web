<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Cotações</title>
    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Inter', sans-serif;
        }
        .vh-100 {
            height: 100vh;
        }
        .login-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .login-header {
            background: #212529;
            color: white;
            border-radius: 12px 12px 0 0 !important;
            padding: 2rem 1rem;
        }
        .btn-primary-custom {
            background-color: #212529;
            border: none;
            padding: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary-custom:hover {
            background-color: #343a40;
            transform: translateY(-1px);
        }
        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(33, 37, 41, 0.1);
            border-color: #212529;
        }
        .alert {
            border-radius: 8px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center align-items-center vh-100">
        <div class="col-md-5 col-lg-4">
            
            <div class="text-center mb-4">
                <h2 class="fw-bold text-dark">📦 CotaçãoWeb</h2>
                <p class="text-muted">Gestão Inteligente de Compras</p>
            </div>

            <div class="card login-card">
                <div class="card-header login-header text-center">
                    <h4 class="mb-0">Acesse sua conta</h4>
                </div>
                <div class="card-body p-4">
                    
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small text-uppercase">Usuário</label>
                            <input 
                                type="text" 
                                name="usuario" 
                                class="form-control" 
                                placeholder="Digite seu usuário"
                                required 
                                autofocus
                            >
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary small text-uppercase">Senha</label>
                            <input 
                                type="password" 
                                name="senha" 
                                class="form-control" 
                                placeholder="••••••••"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 text-white">
                            Entrar no Sistema
                        </button>
                    </form>
                </div>
                <div class="card-footer bg-white border-0 text-center pb-4">
                    <small class="text-muted">&copy; 2026 Sistema de Cotações Profissional</small>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
